# .github/workflows/publish.yml
name: Publish

on:
  # Recommended: publish real releases to PyPI
  release:
    types: [published]

  # Manual publish to either TestPyPI or PyPI
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U setuptools wheel build twine

      # NOTE:
      # Avoid installing heavyweight runtime deps (torch, etc.) during packaging unless your build truly needs it.
      # Most packages can build fine without runtime deps installed.
      - name: Build distributions
        run: python -m build --no-isolation

      - name: Check distributions with twine
        run: python -m twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI (OIDC)
    needs: build
    runs-on: ubuntu-latest
    # OIDC required for Trusted Publishing
    permissions:
      id-token: write
    # Only publish to TestPyPI when manually requested
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'testpypi'
    environment:
      name: testpypi
      url: https://test.pypi.org/project/groundeddino-vl
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist

  publish-pypi:
    name: Publish to PyPI (OIDC)
    needs: build
    runs-on: ubuntu-latest
    # OIDC required for Trusted Publishing
    permissions:
      id-token: write
    # Publish to PyPI on real releases OR manual dispatch selecting pypi
    if: |
      (github.event_name == 'release') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'pypi')
    environment:
      name: pypi
      url: https://pypi.org/project/groundeddino-vl
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
